<!DOCTYPE html>
<html>
<head>
  <style>
    /* Minimalistic two-line panel: connection status + what is being sent.
       Round 13 adds one inline "Rename Selected" button (one-click vision
       rename of the selection's lazy-named nodes) on the connection row —
       the panel keeps its 220x52 size. Everything else (buttons, title)
       stays removed: the command queue makes manual sends unnecessary. */
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; margin: 0; padding: 7px 9px; }
    div { font-size: 11px; line-height: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #row1 { display: flex; align-items: center; gap: 6px; }
    #row1 #conn { flex: 1; min-width: 0; }   /* ellipsize, leave room for the button */
    #renameBtn {
      font-size: 10px; line-height: 12px; padding: 1px 7px; flex: none;
      background: #2d333b; color: #cdd9e5; border: 1px solid #444c56; border-radius: 3px;
      cursor: pointer; white-space: nowrap;
    }
    #renameBtn:hover { background: #3d444d; }
    #renameBtn:disabled { opacity: 0.5; cursor: wait; }
    #conn.on  { color: #7ee787; }   /* green — bridge connected */
    #conn.off { color: #ff7b72; }   /* red — bridge offline */
    #conn { color: #bbb; }          /* connecting… */
    #status { color: #888; margin-top: 2px; }
    #status.ok { color: #7ee787; }
    #status.err { color: #ff7b72; }
  </style>
</head>
<body>
  <div id="row1">
    <div id="conn">connecting…</div>
    <button id="renameBtn" title="AI-rename the selected frames' unnamed layers (one undo step)">Rename Selected</button>
  </div>
  <div id="status">idle</div>

  <script>
    const BRIDGE = "http://localhost:3002";
    // Round 16.3 — per-panel window id. Every long-poll carries it so the
    // bridge can tell plugin windows apart and REMEMBER them between
    // polls (a backgrounded Figma window's polls are throttled — without
    // identity+memory the bridge undercounts open windows and the
    // multi-window "which frame did you mean?" ask never fires).
    const WID = Math.random().toString(36).slice(2, 10);
    const status = (t, cls) => {
      const el = document.getElementById("status");
      el.innerText = t.length > 60 ? t.slice(0, 59) + "…" : t;
      el.className = cls ?? "";
    };
    const conn = (t, cls) => {
      const el = document.getElementById("conn");
      el.innerText = t;
      el.className = cls ?? "";
    };

    // --- agent command loop (long-poll) -----------------------------------
    // The bridge HOLDS each request up to ~10s until a command arrives, so
    // delivery is near-instant. On fetch error we back off 1.5s and retry —
    // polling is self-healing across plugin reloads by design.
    const knownCommands = {}; // commandId -> type (for status display)

    async function deliverResult(msg) {
      const label = knownCommands[msg.commandId] || "command";
      try {
        await fetch(BRIDGE + "/api/agent/commands/" + msg.commandId + "/result", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(msg.error ? { error: msg.error } : { payload: msg.payload }),
        });
        status(msg.error ? "✗ " + label + ": " + msg.error : "✓ sent " + label, msg.error ? "err" : "ok");
      } catch {
        status("✗ bridge unreachable while delivering " + label, "err");
      }
    }

    async function pollAgent() {
      for (;;) {
        try {
          const res = await fetch(BRIDGE + "/api/agent/commands/pending?wid=" + WID);
          const data = await res.json();
          conn("● bridge online", "on");
          if (data.command) {
            knownCommands[data.command.id] =
              data.command.type + (data.command.params?.id ? " " + data.command.params.id : "");
            status("→ " + knownCommands[data.command.id]);
            parent.postMessage({
              pluginMessage: {
                type: "agent-command",
                commandId: data.command.id,
                commandType: data.command.type,
                params: data.command.params,
              },
            }, "*");
          }
          // no sleep needed on success — the long-poll itself paces the loop
        } catch {
          conn("● bridge offline — retrying", "off");
          await new Promise((r) => setTimeout(r, 1500));
        }
      }
    }
    // --- "Rename Selected" button (Round 13) -------------------------------
    // One-click: bridge asks the plugin for the selection via the command
    // queue, renders + vision-suggests + applies (one undo step). The
    // vision call takes ~5s, so the button disables while running.
    const renameBtn = document.getElementById("renameBtn");
    renameBtn.onclick = async () => {
      renameBtn.disabled = true;
      status("renaming… (vision model, ~5s)", "");
      try {
        const res = await fetch(BRIDGE + "/api/rename/selected", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          status("✗ " + (data.error || "rename failed"), "err");
        } else if ((data.applied || []).length === 0) {
          status(data.message || "nothing renamed", "");
        } else {
          const n = data.applied.length;
          status("✓ renamed " + n + (n === 1 ? " node" : " nodes") + " — ⌘Z to undo", "ok");
        }
      } catch {
        status("✗ bridge offline (port 3002)", "err");
      } finally {
        renameBtn.disabled = false;
      }
    };

    pollAgent();

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "command-result") {
        deliverResult(msg);
        return;
      }

      if (msg.type === "selection-data") {
        try {
          const res = await fetch(BRIDGE + "/api/design-tree", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ frames: msg.payload }),
          });
          if (res.ok) {
            const data = await res.json();
            status("✓ stored " + data.saved.map(f => f.name).join(", "), "ok");
          } else {
            status("✗ server error response", "err");
          }
        } catch (err) {
          status("✗ bridge offline (port 3002)", "err");
        }
      }

      if (msg.type === "page-index-data") {
        try {
          const res = await fetch(BRIDGE + "/api/page-index", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(msg.payload),
          });
          const n = (msg.payload.pages || []).reduce((a, p) => a + (p.children || []).length, 0);
          status(res.ok ? "✓ " + n + " frames indexed" : "✗ server error response", res.ok ? "ok" : "err");
        } catch (err) {
          status("✗ bridge offline (port 3002)", "err");
        }
      }
    };
  </script>
</body>
</html>
