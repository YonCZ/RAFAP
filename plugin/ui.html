<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 16px; background: #1e1e1e; color: #fff; text-align: center; }
    button { background: #0D99FF; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 6px; }
    button:hover { background: #0b82db; }
    button.secondary { background: #2d2d2d; border: 1px solid #555; }
    button.secondary:hover { background: #3a3a3a; }
    #status { margin-top: 10px; font-size: 12px; color: #aaa; white-space: pre-line; min-height: 16px; }
    #conn { margin-top: 6px; font-size: 11px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h3>Figma Agent</h3>
  <div id="conn">connecting…</div>
  <button id="send-btn">Send Selected Frame(s)</button>
  <button id="index-btn" class="secondary">Send Page Index</button>
  <div id="status">Ready</div>

  <script>
    const BRIDGE = "http://127.0.0.1:3002";
    const status = (t) => { document.getElementById("status").innerText = t; };
    const conn = (t) => { document.getElementById("conn").innerText = t; };

    // --- manual buttons (fallback) ---------------------------------------
    document.getElementById("send-btn").onclick = () => {
      status("Sending...");
      parent.postMessage({ pluginMessage: { type: "export-selection" } }, "*");
    };
    document.getElementById("index-btn").onclick = () => {
      status("Sending page index...");
      parent.postMessage({ pluginMessage: { type: "export-page-index" } }, "*");
    };

    // --- agent command loop (long-poll) -----------------------------------
    // The bridge HOLDS each request up to ~10s until a command arrives, so
    // delivery is near-instant. On fetch error we back off 1.5s and retry —
    // polling is self-healing across plugin reloads by design.
    const knownCommands = {}; // commandId -> type (for status display)

    async function deliverResult(msg) {
      try {
        await fetch(BRIDGE + "/api/agent/commands/" + msg.commandId + "/result", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(msg.error ? { error: msg.error } : { payload: msg.payload }),
        });
        const label = knownCommands[msg.commandId] || "command";
        status(msg.error ? "❌ " + msg.error : "✅ Sent to agent: " + label);
      } catch {
        status("❌ Bridge unreachable while delivering result");
      }
    }

    async function pollAgent() {
      for (;;) {
        try {
          const res = await fetch(BRIDGE + "/api/agent/commands/pending");
          const data = await res.json();
          conn("🟢 connected — listening for agent");
          if (data.command) {
            knownCommands[data.command.id] =
              data.command.type + (data.command.params?.id ? " " + data.command.params.id : "");
            parent.postMessage({
              pluginMessage: {
                type: "agent-command",
                commandId: data.command.id,
                commandType: data.command.type,
                params: data.command.params,
              },
            }, "*");
          }
          // no sleep needed on success — the long-poll itself paces the loop
        } catch {
          conn("🔴 bridge offline — retrying");
          await new Promise((r) => setTimeout(r, 1500));
        }
      }
    }
    pollAgent();

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "command-result") {
        deliverResult(msg);
        return;
      }

      if (msg.type === "selection-data") {
        try {
          const res = await fetch(BRIDGE + "/api/design-tree", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ frames: msg.payload }),
          });
          if (res.ok) {
            const data = await res.json();
            status("✅ Stored " + data.saved.map(f => f.name).join(", "));
          } else {
            status("❌ Server error response.");
          }
        } catch (err) {
          status("❌ Is the bridge running on port 3002? (npm run start:dev)");
        }
      }

      if (msg.type === "page-index-data") {
        try {
          const res = await fetch(BRIDGE + "/api/page-index", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(msg.payload),
          });
          const n = (msg.payload.pages || []).reduce((a, p) => a + (p.children || []).length, 0);
          status(res.ok ? "✅ Page index stored (" + n + " frames)" : "❌ Server error response.");
        } catch (err) {
          status("❌ Is the bridge running on port 3002? (npm run start:dev)");
        }
      }
    };
  </script>
</body>
</html>
